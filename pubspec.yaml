name: saathi
description: Your mental wellness companion
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core Dependencies
  cupertino_icons: ^1.0.2
  collection: ^1.18.0
  path: ^1.9.0

  # Storage & State Management
  shared_preferences: ^2.5.0
  provider: ^6.1.1

  # AI (HTTP for Gemini REST API)
  http: ^1.2.0
  dio: ^5.5.0
  crypto: ^3.0.3
  flutter_gemma: ^0.12.6

  # Voice Assistant (Offline — On-Device)
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.3

  # Audio Player (Cross-platform)
  audioplayers: ^6.6.0

  # Notifications (Cross-platform support)
  flutter_local_notifications: ^21.0.0

  # Path Provider (Cross-platform)
  path_provider: ^2.1.5

  # Icons
  font_awesome_flutter: ^10.6.0

  # Timezone & Internationalization
  timezone: ^0.11.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  lottie: ^3.3.2
  visibility_detector: ^0.4.0+2
  local_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# ============================================================
# CUSTOM APP ICON CONFIGURATION
# Icon ko generate karne ke liye: flutter pub run flutter_launcher_icons
# ============================================================
flutter_launcher_icons:
  android: true
#  ios: true
#  windows: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  # Windows specific configuration
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  # iOS specific configuration
  ios:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # Fonts
#  fonts:
#    - family: Poppins
#      fonts:
#        - asset: fonts/Poppins-Regular.ttf
#        - asset: fonts/Poppins-Medium.ttf
#          weight: 500
#        - asset: fonts/Poppins-SemiBold.ttf
#          weight: 600
#        - asset: fonts/Poppins-Bold.ttf
#          weight: 700

  # Assets
  assets:
    - assets/audio/
    - assets/icon/
    - assets/books/
    - assets/articles/
    - assets/animations/
    - assets/images/
    - assets/lottie/
    - assets/ai/
    - assets/data/
